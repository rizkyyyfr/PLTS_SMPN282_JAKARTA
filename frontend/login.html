<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Monitoring PLTS SMPN 282 Jakarta</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <main class="login-card">

    <a class="brand login-brand" href="/login.html" aria-label="Monitoring PLTS SMPN 282 Jakarta">
      <span class="brand-mark"><i></i><i></i><i></i><i></i></span>
      <span>MONITORING PLTS<br>SMPN 282 Jakarta</span>
    </a>

    <h1>Selamat datang</h1>
    <p>Silakan masuk untuk melanjutkan ke Monitoring PLTS SMPN 282 Jakarta.</p>

    <form id="loginForm" class="login-form">
      <label>Email<input id="username" name="username" type="email" autocomplete="email" required autofocus /></label>
      <label>Kata sandi<input id="password" name="password" type="password" autocomplete="current-password" required /></label>
      <p id="loginError" class="login-error" role="alert"></p>
      <button class="login-submit" type="submit">Masuk</button>
    </form>

    <div class="login-footer" aria-label="Didukung oleh Politeknik Negeri Jakarta dan Sudin Pemerintah">
      <span class="login-footer-label">Didukung oleh</span>
      <div class="login-footer-marks">
        <img src="/assets/logo-pnj.png" alt="Logo Politeknik Negeri Jakarta" />
        <span class="login-footer-divider"></span>
        <img src="/assets/logo-sudin.png" alt="Logo Sudin Pemerintah" />
      </div>
    </div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-client.js"></script>
  <script src="login.js"></script>
</body>
</html>
