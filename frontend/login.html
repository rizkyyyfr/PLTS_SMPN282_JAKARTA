<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Monitoring PLTS SMPN 282 Jakarta</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <section class="login-identity" aria-label="Identitas aplikasi">
      <a class="login-lockup" href="/login.html" aria-label="Monitoring PLTS SMPN 282 Jakarta">
        <span class="brand-mark"><i></i><i></i><i></i><i></i></span>
        <span><strong>Monitoring PLTS</strong><small>SMPN 282 Jakarta</small></span>
      </a>
      <p class="login-tagline">Pantau produksi energi surya sekolah secara real-time.</p>
      <div class="login-supported" aria-label="Didukung oleh Politeknik Negeri Jakarta dan Sudin Pemerintah">
        <span>Didukung oleh</span>
        <div class="login-logos">
          <img src="/assets/logo-pnj.png" alt="Logo Politeknik Negeri Jakarta" />
          <span class="login-logo-divider"></span>
          <img src="/assets/logo-sudin.png" alt="Logo Sudin Pemerintah" />
        </div>
      </div>
    </section>
    <section class="login-form-panel">
  <div class="login-form-header">
    <span class="login-eyebrow">PORTAL MONITORING</span>
    <h1>Selamat datang</h1>
    <p>Masuk untuk mengakses dashboard monitoring PLTS SMPN 282 Jakarta.</p>
  </div>

  <form id="loginForm" class="login-form">

    <label class="input-group">
      <span>Email</span>
      <div class="input-wrapper">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/>
          <path d="m4 7 8 6 8-6"/>
        </svg>
        <input
          id="username"
          name="username"
          type="email"
          autocomplete="email"
          placeholder="nama@email.com"
          required
          autofocus
        />
      </div>
    </label>

    <label class="input-group">
      <span>Kata sandi</span>
      <div class="input-wrapper">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="10" width="16" height="10" rx="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Masukkan kata sandi"
          required
        />
      </div>
    </label>

    <p id="loginError" class="login-error" role="alert"></p>

    <button class="login-submit" type="submit">
      <span>Masuk ke Dashboard</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12h14"/>
        <path d="m13 6 6 6-6 6"/>
      </svg>
    </button>

  </form>

  <div class="login-security">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3 20 6v5c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10V6l8-3Z"/>
      <path d="m9 12 2 2 4-4"/>
    </svg>
    <span>Akses aman untuk pengguna terdaftar</span>
  </div>
</section>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-client.js"></script>
  <script src="login.js"></script>
</body>
</html>
